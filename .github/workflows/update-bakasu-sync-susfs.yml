name: Update BakaSU sync susfs

on:
  #schedule:
    # 00:17, 06:17, 12:17, 18:17 UTC
    #- cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a kernel Release after updating BakaSU'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: bakasu-auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Update BakaSU submodule and README
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout sync-susfs
        uses: actions/checkout@v7
        with:
          ref: sync-susfs
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Check BakaSU main
        id: ksu
        shell: bash
        run: |
          set -euo pipefail

          current="$(git -C KernelSU rev-parse HEAD)"
          git -C KernelSU fetch origin main --tags --force
          latest="$(git -C KernelSU rev-parse origin/main)"

          echo "Current: $current"
          echo "Latest : $latest"

          updated=false
          if [ "$current" != "$latest" ]; then
            git -C KernelSU checkout --detach "$latest"
            updated=true
          else
            echo "BakaSU is already current."
          fi

          short="$(git -C KernelSU rev-parse --short=8 HEAD)"
          desc="$(git -C KernelSU describe --tags --always)"
          count="$(git -C KernelSU rev-list --count HEAD)"
          code="$((30700 + count))"

          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "desc=$desc" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

          echo "BakaSU: $desc"
          echo "Version code: $code"

      - name: Sync README metadata
        id: readme
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/update_readme_versions.py

          changed=false
          if ! git diff --quiet -- README.md README_KO.md; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit submodule and README update
        if: steps.ksu.outputs.updated == 'true' || steps.readme.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add KernelSU README.md README_KO.md
          git diff --cached --submodule=short

          if [ "${{ steps.ksu.outputs.updated }}" = "true" ]; then
            git commit -m "kernelsu: update BakaSU to ${{ steps.ksu.outputs.short }}"
          else
            git commit -m "docs: sync BakaSU README metadata"
          fi
          git push origin HEAD:sync-upstream

